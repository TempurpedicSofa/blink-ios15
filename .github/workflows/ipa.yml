name: Blink iOS 15 IPA

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout this workflow
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout Blink 15.0.10
        run: |
          git config --global url.https://github.com/.insteadOf git@github.com:
          git init blink
          cd blink
          git remote add origin https://github.com/blinksh/blink.git
          git fetch --depth 1 origin 838ba6be408f6ef89e4f5d6a920b6d8433ca5d75
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
          xcodebuild -showsdks | head -40

      - name: Developer config
        working-directory: blink
        run: |
          python3 -c 'open("developer_setup.xcconfig","w").write("""TEAM_ID =
          BUNDLE_ID = dev.lisp.blinkshell
          GROUP_ID = dev.lisp.blinkshell
          CLOUD_ID = dev.lisp.blinkshell
          KEYCHAIN_ID1 = dev.lisp.blinkshell
          SWIFT_ACTIVE_COMPILATION_CONDITIONS[config=Debug] = BLINK_PUBLISHING_OPTION_DEVELOPER
          SWIFT_ACTIVE_COMPILATION_CONDITIONS[config=Release] = BLINK_PUBLISHING_OPTION_DEVELOPER
          BLINK_MIGRATION_SCHEME = blinkv15
          """)'

      - name: Drop paid-capability entitlements
        working-directory: blink
        run: |
          python3 -c '
          import pathlib
          text = """<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
          <plist version=\"1.0\"><dict>
          <key>com.apple.security.application-groups</key>
          <array><string>group.dev.lisp.blinkshell</string></array>
          <key>keychain-access-groups</key>
          <array><string>$(AppIdentifierPrefix)dev.lisp.blinkshell</string></array>
          </dict></plist>
          """
          for name in ("Blink/Blink.entitlements", "BlinkFileProvider/BlinkFileProvider.entitlements"):
              pathlib.Path(name).write_text(text)
          '

      - name: Pin packages whose tags disappeared
        working-directory: blink
        run: |
          sed -i '' 's|swift-tools-version:5.3|swift-tools-version:5.5|' xcfs/Package.swift
          sed -i '' 's|https://github.com/yury/ios_system/releases/download/v2.9.3/|https://github.com/blinksh/ios_system/releases/download/v2.9.3/|g' xcfs/Package.swift
          sed -i '' 's|.package(url: "https://github.com/yury/SSHConfig", from: "0.0.5"),|.package(url: "https://github.com/yury/SSHConfig", .revision("357648c1ecd2206585a14e61d09e6bb781d085b0")),|' xcfs/Package.swift
          sed -i '' 's|.package(url: "https://github.com/yury/FMake", from: "0.0.15"),|.package(url: "https://github.com/yury/FMake", .revision("db46d80e35764c2367fb23ea01e1876d2c2fa9a6")),|' xcfs/Package.swift
          sed -i '' 's|.package(url: "https://github.com/blinksh/BlinkBuild", from: "0.0.22"),|.package(url: "https://github.com/blinksh/BlinkBuild", .revision("90576edfec9c71d4322cb164e24934f265b6ebf1")),|' xcfs/Package.swift
          sed -i '' 's|.package(url: "https://github.com/blinksh/swift-argument-parser", .upToNextMinor(from: "0.5.1")),|.package(url: "https://github.com/blinksh/swift-argument-parser", .revision("3988c22d6601691d431b00b8b551b1fd6567d2ba")),|' xcfs/Package.swift
          rm -f xcfs/Package.resolved
          grep -n 'package(url\|ios_system/releases\|swift-tools-version' xcfs/Package.swift

      - name: Use fileno for session streams
        working-directory: blink
        run: |
          sed -i '' 's/ios_stdinFd()/fileno(thread_stdin)/' Blink/Commands/build.m
          sed -i '' 's/ios_stdoutFd()/fileno(thread_stdout)/' Blink/Commands/build.m
          sed -i '' 's/ios_stderrFd()/fileno(thread_stderr)/' Blink/Commands/build.m
          grep -n 'fileno(thread_' Blink/Commands/build.m

      - name: Download xcframeworks
        working-directory: blink
        run: python3 "$GITHUB_WORKSPACE/ci/fetch_frameworks.py"

      - name: Resolve frameworks
        working-directory: blink
        run: ./get_frameworks.sh

      - name: Stub libbuild_cli
        working-directory: blink
        run: |
          python3 -c 'open("/tmp/build_cli_stub.c","w").write("#include <sys/ioctl.h>\nint blink_build_cmd(int c, char **v, void *e, void **s){return 1;}\nvoid build_auto_start_wg_ports(void){}\nvoid signal_release(void *p){}\nvoid signal_send(void *p, int sig){}\nvoid signal_winsize(void *p, struct winsize *w){}\n")'
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0 -c /tmp/build_cli_stub.c -o /tmp/build_cli_stub.o
          mkdir -p Frameworks
          xcrun libtool -static -o Frameworks/libbuild_cli.a /tmp/build_cli_stub.o
          ls -l Frameworks/libbuild_cli.a

      - name: Build unsigned Debug app
        working-directory: blink
        run: |
          set -o pipefail
          xcodebuild \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build

      - name: Pack IPA
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -type d -name 'Blink.app' | head -1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Blink-15.0.10-ios15.ipa Payload
          ls -lh Blink-15.0.10-ios15.ipa
          # deployment target stamped in the binary
          vtool -show-build Payload/Blink.app/Blink | head -20 || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blink-15.0.10-ios15
          path: Blink-15.0.10-ios15.ipa
          retention-days: 14
